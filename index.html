body{
margin: 0;
background: linear-gradient(180deg, #C75213 0%, #FF851F 17%, #FF6B15 32%, #E25207 48%, #FF6B15 59%, #E27516 81%, #CD4B06 92%);

.main-page{
    position: fixed;

}

header{
    height: 33vh;
}

.info{
    height: 5.93vh;
    width: 100vw;
}

.title{ 
    height: 16.82vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    font-weight: bolder; 
    font-size: 80px;

} 

.photo-gallery{ 
    height: 7.25vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
}

.gallery{
    position: relative;
    height: 100%;
    width: 180px;
    background: rgba(0, 0, 0, 0.479);
    border-radius: 40px;
    box-shadow: inset 5px 5px 10px rgba(0, 0, 0, 0.3), inset -5px -5px 10px rgba(0, 0, 0, 0.3); 
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid;
    color: white;
    cursor: pointer;


}    
/* ^^^for gallery    box-shadow: inset 5px 5px 10px rgba(252, 252, 252, 0.308), inset -5px -5px 10px rgba(0, 0, 0, 0.3); 
    box-shadow: inset 5px 5px 10px rgba(252, 252, 252, 0.308), inset -5px -5px 10px rgba(0, 0, 0, 0.3); 


*/



.gallery div:nth-child(1){
    height: 100%;
    border-radius: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 19px;


}    

.photo-count{
    right: 3%; 
    width: 5.2vh;
    height: 5.2vh;
    border-radius: 50%;
    display: flex; 
    color: rgb(4, 4, 4);
    justify-content: center;
    align-items: center;
    background-image: url('pumpkin-icon.svg'); 
    background-repeat: no-repeat;
    background-position: 50% 45%; 
    background-size: 95%;
    font-weight: bold;
    opacity: .5;
    
}

.main{ 
    height: 53vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.bingo-board{
    position: relative;
    height: 80%;  
    width: 93%;
    border: 2px solid black;
    border-radius: 5px;  
    background: rgba(0, 0, 0, 0.537);
    display: flex;
    display: grid;
  grid-template-columns: repeat(5, 1fr); 
  grid-template-rows: repeat(5, 1fr);    
}

.bingo-square {
  background-color: #fef9c3; 
  border: 2px solid black;
  border-radius: 5px;  
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  font-weight: bold; 
  font-size: 14px;
  width: auto; 
  display: flex;
  justify-content: center;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  overflow-wrap: break-word; 
  word-break: break-word; 
  white-space: normal;  
  
  text-align: center; 
}

.free-cell{
    background-color: #050505;; 
    border: 2px solid black;
    border-radius: 5px;  
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    font-weight: bold; 
    display: flex;
    color: white; 
    justify-content: center;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    text-align: center;
} 

.bingo-board div:hover{

footer{

.bingo{

.list{

.bingo-image-screen{

.bingo-image-image{

.bingo-image-close-button{

.bingo-take-image{

.bingo-take-image input[type="file"] {

.listopher{

border: 2px solid;

    gap: 20px;

}

.bingo-bio-container{

}

}

.gallery-screen{
    position: relative;
    height: 100vh;
    background: rgb(0 0 0 /  98%);
    display: none;
    justify-content: center;
    align-items: center;
    transition: 0.2s all ease-in-out;
} 

.gallery-screen-title{
    height: 35px;
position: absolute;
top: 10%;
color: white;
display: flex;
gap: 20px; 
justify-content: center;
align-items: center; 
font-size: 28px;
}

 
.gallery-screen-images{

    width: 100vh;
    height: 500px;
    display: flex;
    gap: 25vw;
    overflow-x: scroll;
    align-items: center;
    padding-left: 50%;
    padding-right: 50%;
    
    scroll-snap-type: x mandatory; 
    box-sizing: border-box;

    

}  


.gallery-image-container{
    display: none; 
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    gap: 20px;
}
.gallery-screen-image{
    width: 300px ;
    height: 400px;
      flex-shrink: 0;   /* Stops the parent from squeezing it */
 
     scroll-snap-align: center; 
         scroll-snap-stop: always; 


}
.gallery-screen-image img{
object-fit: contain;
width: 100%;
height: 100%;

}


/* Individual winning squares */

.square-pop {
    animation: squareRaise 0.4s ease forwards;
    z-index: 5;
}

@keyframes squareRaise {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-25px) scale(1.08);
    }

    100% {
        transform: translateY(-15px);
    }

}


/* Entire board animation */

.board-win {
    animation: boardSmash 0.7s ease forwards;
}

@keyframes boardSmash {

    0% {
        transform: translateY(0) scale(1);
    }

    35% {
        transform: translateY(-60px) scale(1.04);
    }

    65% {
        transform: translateY(15px) scale(0.96);
    }

    85% {
        transform: translateY(-10px) scale(1.02);
    }

    100% {
        transform: translateY(0) scale(1);
    }

}


/* BINGO message */

.bingo-win-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    font-size: 65px;
    font-weight: 900;
    color: rgb(249, 135, 4);
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    font-weight: bolder;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    text-shadow: 5px 5px 0 black;

    z-index: 100;
    pointer-events: none;

    animation: bingoText 0.5s ease forwards;
}

@keyframes bingoText {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
    }

    70% {
        transform: translate(-50%, -50%) scale(1.2);
    }

    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

}


/* No bingo shake */

.shake-board {
    animation: shake 0.4s ease;
}

@keyframes shake {

    0%, 100% {
        transform: translateX(0);
    }

    20%, 60% {
        transform: translateX(-12px);
    }

    40%, 80% {
        transform: translateX(12px);
    }

}


/* No bingo message */

.no-bingo-message {
    position: absolute;
    top: -45px;
    left: 50%;
    transform: translateX(-50%);

    color: black;
    font-weight: bold;
    font-size: 22px;

    white-space: nowrap;
    z-index: 100;
}
